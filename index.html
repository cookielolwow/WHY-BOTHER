<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050508" />
    <title>Why Bother? · Comuna 13</title>
    <meta name="description" content="Experiencia interactiva 3D: vinilo, hip hop y el despertar creativo del ser humano." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body data-energy="0">

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- CRT Scanlines -->
    <div class="scanlines" aria-hidden="true"></div>

    <!-- SVG filter for melt effect on title -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <filter id="melt" x="-20%" y="-20%" width="140%" height="160%">
          <feTurbulence id="meltTurb" type="fractalNoise" baseFrequency="0.012 0.22"
            numOctaves="3" seed="2" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="0"
            xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <!-- ═══════════════════════════════════════════
         SPLASH / INTRO
    ═══════════════════════════════════════════ -->
    <div id="splash" class="splash">
      <div class="splash-noise" aria-hidden="true"></div>
      <div class="splash-inner">

        <p class="splash-city">COMUNA 13 · MEDELLÍN · 2026</p>

        <h1 class="splash-title">
          <span class="splash-why">WHY</span>
          <span class="splash-bother">BOTHER?</span>
        </h1>

        <p class="splash-question">¿Para qué tomarte el trabajo de crear?</p>

        <div class="splash-rule"></div>

        <p class="splash-desc">
          Arrastra el vinilo para despertar al ser.<br>
          Tú pones la energía — la máquina no puede.
        </p>

        <button id="splashBtn" class="splash-btn" type="button">
          GIRAR EL VINILO
        </button>

        <p class="splash-hint">o presiona <kbd>ESPACIO</kbd></p>

      </div>
    </div>

    <!-- Visualizer -->
    <canvas id="vizCanvas" class="viz-canvas" aria-hidden="true"></canvas>

    <div class="screen-controls" aria-label="Controles de pantalla">
      <button id="hudHideBtn" class="btn screen-control" type="button" aria-label="Ocultar interfaz" title="Ocultar UI [H]">UI−</button>
      <button id="hudRevealBtn" class="btn screen-control hud-reveal-btn" type="button" aria-label="Mostrar interfaz" title="Mostrar UI [H]">UI+</button>
      <button id="fullscreenBtn" class="btn screen-control" type="button" aria-label="Pantalla completa" title="Pantalla completa [F]">⛶</button>
    </div>

    <!-- ═══════════════════════════════════════════
         HUD — se oculta con H
    ═══════════════════════════════════════════ -->
    <main class="hud" id="hud">

      <!-- TOP -->
      <header class="hud-header">
        <div class="brand">
          <h2 class="title">WHY BOTHER?</h2>
        </div>
      </header>

    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
